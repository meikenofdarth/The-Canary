audio:
  sample_rate: 16000
  chunk_size: 512
  channels: 1
  dtype: float32
  mic_device_id: null

stage0:
  vad_threshold: 0.5
  vad_min_speech_ms: 250
  vad_min_silence_ms: 100
  wakeword_model: "hey_jarvis"
  wakeword_threshold: 0.5
  wakeword_window_ms: 1000
  noise_floor_threshold: 0.9
  noise_floor_window_chunks: 10
  require_wakeword: true

stage1:
  highpass_cutoff_hz: 80
  highpass_order: 4
  normalize_target_db: -23
  feature_window_samples: 1600
  feature_hop_samples: 512
  speaker_count_min_correlation: 0.3
  speaker_count_mfcc_bins: 13
  max_speaker_count: 3
  snr_noise_percentile: 10

dynamic_resource_scaler:
  weight_overlap: 0.70
  weight_noise: 0.20
  weight_speaker_uncertainty: 0.10
  mode_a_threshold: 0.22
  mode_c_threshold: 0.40
  hysteresis_margin: 0.05
  mode_hold_ms: 500
